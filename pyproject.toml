[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-ai"
version = "0.1.0"
description = "Autonomous, AI-powered software development lifecycle system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "litellm>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "watchdog>=3.0.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "roles*"]
